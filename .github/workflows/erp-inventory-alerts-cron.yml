# Resumen diario de stock mínimo por organización (ver
# src/app/api/cron/erp-inventory-alerts/route.ts). Corre cada hora en punto:
# cada organización elige su propia hora_resumen (0-23, hora de Bogotá) y el
# endpoint solo envía a las que coinciden con la hora actual.
#
# Antes de este workflow nada llamaba a esta ruta — el resumen diario nunca se
# enviaba, aunque la lógica y la plantilla de correo ya estaban implementadas.
# Corre en GitHub Actions, igual que el backup de la base de datos
# (backup-db-drive.yml) y el cron de facturación (billing-cron.yml), porque la
# app corre en Coolify, no en Vercel (no hay Vercel Cron disponible).
#
# Requisitos en GitHub → Settings → Secrets and variables → Actions:
#   APP_URL      = https://app.noova360.com (o el dominio de producción real)
#   CRON_SECRET  = el mismo valor que la variable de entorno CRON_SECRET en Coolify

name: ERP Inventory Alerts Cron

on:
  schedule:
    - cron: '0 * * * *' # cada hora en punto (UTC)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: erp-inventory-alerts-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar /api/cron/erp-inventory-alerts
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Faltan secrets APP_URL / CRON_SECRET." >&2
            exit 1
          fi
          response=$(curl -sS -o response.json -w "%{http_code}" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/erp-inventory-alerts")
          echo "HTTP $response"
          cat response.json
          echo
          if [ "$response" -ge 300 ]; then
            echo "El cron de alertas de inventario respondió con error." >&2
            exit 1
          fi
