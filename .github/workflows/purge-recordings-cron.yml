# Retención de grabaciones de llamadas: borra las que tienen más de 12 meses
# (ver src/app/api/cron/purge-recordings/route.ts). Corre una vez al día.
#
# Mismo criterio que erp-inventory-alerts-cron.yml: la app corre en Coolify,
# no en Vercel, así que no hay Vercel Cron disponible — GitHub Actions hace
# de scheduler externo.
#
# Requisitos en GitHub → Settings → Secrets and variables → Actions (ya
# existen, compartidos con los demás cron de este repo):
#   APP_URL      = https://app.noova360.com (o el dominio de producción real)
#   CRON_SECRET  = el mismo valor que la variable de entorno CRON_SECRET en Coolify

name: Purge Recordings Cron

on:
  schedule:
    - cron: '15 7 * * *' # diario 07:15 UTC (02:15 Bogotá)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: purge-recordings-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar /api/cron/purge-recordings
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Faltan secrets APP_URL / CRON_SECRET." >&2
            exit 1
          fi
          response=$(curl -sS -o response.json -w "%{http_code}" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/purge-recordings")
          echo "HTTP $response"
          cat response.json
          echo
          if [ "$response" -ge 300 ]; then
            echo "El cron de retención de grabaciones respondió con error." >&2
            exit 1
          fi
